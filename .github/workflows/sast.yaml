name: SAST
on:
  pull_request:

jobs:
  sast:
    name: semgrep-oss/scan
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Scan
        shell: bash
        run: semgrep scan --config auto --error --verbose
